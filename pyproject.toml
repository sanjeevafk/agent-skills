[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skills"
version = "0.2.0"
description = "Skill delivery framework tooling (validators, compilers, benchmark harness)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
 test = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[tool.setuptools]
# Repo tooling lives in scripts/ and is invoked directly; no distributable package.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
