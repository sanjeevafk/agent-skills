# Warehouse manifest: source of truth for layout rules enforced by tests/test_warehouse_integrity.py

# skills/       first-party or locally curated skills (wins on name collisions)
# collections/  vendored upstream mirrors (managed by `agent-skills sync`)
# canonical/    symlinks only: the active runtime set listed below

# A skill present in both skills/ and collections/ must either be a symlink or be
# listed under [forks], meaning it intentionally diverges from upstream.

[canonical]
skills = ["agent-browser", "agent-reach", "be-ambitious", "brainstorming", "bro", "code-review", "code-simplification", "deep-research", "egm-bootstrap", "egm-brainstorm", "egm-draft", "egm-drift-report", "egm-resolve", "egm-review", "egm-review-loop", "error-handling", "exa-search", "grill-me", "humanizer", "karpathy-guidelines", "receiving-code-review", "scrapling", "security-audit", "skill-router", "stageshow", "systematic-debugging", "tdd", "unslop"]

[forks]
# local skill = upstream path it diverges from
"arena" = "collections/cursor-pstack/arena"
"bro" = "collections/cursor-pstack/bro"
"claude-agent-observability" = "collections/claude-agent-architectures/claude-agent-observability"
"claude-chief-of-staff" = "collections/claude-agent-architectures/claude-chief-of-staff"
"claude-sre-incident-responder" = "collections/claude-agent-architectures/claude-sre-incident-responder"
"claude-vulnerability-detection" = "collections/claude-agent-architectures/claude-vulnerability-detection"
"create-verification-skill" = "collections/cursor-pstack/create-verification-skill"
"deep-research" = "collections/academic-research-skills/deep-research"
"hf-cli" = "collections/huggingface-skills/hf-cli"
"playground" = "collections/stageshow/playground"
"poteto-mode" = "collections/cursor-pstack/poteto-mode"
"prototype" = "collections/emil-design-suite/prototype"
"tdd" = "collections/cursor-pstack/tdd"
"unslop" = "collections/cursor-pstack/unslop"
"why" = "collections/cursor-pstack/why"
