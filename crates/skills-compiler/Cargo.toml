[package]
name = "skills-compiler"
version = "0.1.0"
edition = "2021"
description = "Adaptive, structure-preserving static compiler for coding agent skills (SKILL.md)"
authors = ["Sanjeev Kumar"]
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
regex = "1.10"
walkdir = "2.5"
rayon = "1.10"
