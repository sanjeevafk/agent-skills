# To learn more about Dependabot configuration, please see:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies (open-pull-requests-limit: 0 disables routine version bumps; security updates remain active)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # GitHub Actions (open-pull-requests-limit: 0 disables routine version bumps; security updates remain active)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  # Explicitly ignore dependency-auditor mock test fixture so alerts & automated PRs are not generated for test data
  - package-ecosystem: "npm"
    directory: "/skills/dependency-auditor/test-project"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
