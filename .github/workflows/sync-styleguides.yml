name: Sync Google Style Guides

on:
  schedule:
    # Run every Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      guides:
        description: 'Comma-separated list of guides to sync (leave empty for all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sync:
    name: Download & Convert Guides
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: pip install 'beautifulsoup4==4.13.4' 'lxml==5.3.2'

      - name: Download latest guides from google/styleguide
        id: download
        run: |
          set -euo pipefail

          BASE_URL="https://raw.githubusercontent.com/google/styleguide/gh-pages"

          declare -A GUIDES=(
            ["jsguide.html"]="skills/google-style-javascript/references/full_guide.md"
            ["tsguide.html"]="skills/google-style-typescript/references/full_guide.md"
            ["cppguide.html"]="skills/google-style-cpp/references/full_guide.md"
            ["javaguide.html"]="skills/google-style-java/references/full_guide.md"
          )

          declare -A GO_GUIDES=(
            ["go/guide.md"]="skills/google-style-go/references/guide.md"
            ["go/best-practices.md"]="skills/google-style-go/references/best_practices.md"
            ["go/decisions.md"]="skills/google-style-go/references/decisions.md"
            ["go/index.md"]="skills/google-style-go/references/index.md"
          )

          FILTER="${{ github.event.inputs.guides }}"
          downloaded=0

          echo "=== Downloading HTML guides ==="
          for src in "${!GUIDES[@]}"; do
            dest="${GUIDES[$src]}"
            name="${src%.html}"

            # Skip if filter specified and this guide not in filter
            if [ -n "$FILTER" ] && ! echo "$FILTER" | grep -qw "$name"; then
              echo "Skipping $src (not in filter)"
              continue
            fi

            echo "Downloading $src ..."
            tmp="$(mktemp /tmp/guide_XXXXXX.html)"
            if curl -fsSL "$BASE_URL/$src" -o "$tmp"; then
              python3 scripts/convert_html_guide.py "$tmp" "$dest"
              downloaded=$((downloaded + 1))
              echo "  -> Converted to $dest"
            else
              echo "  WARNING: Failed to download $src, skipping"
            fi
            rm -f "$tmp"
          done

          echo "=== Downloading Go Markdown guides ==="
          for src in "${!GO_GUIDES[@]}"; do
            dest="${GO_GUIDES[$src]}"
            if [ -n "$FILTER" ] && ! echo "$FILTER" | grep -qw "go"; then
              echo "Skipping $src (not in filter)"
              continue
            fi
            echo "Downloading $src ..."
            if curl -fsSL "$BASE_URL/$src" -o "$dest"; then
              downloaded=$((downloaded + 1))
              echo "  -> Saved to $dest"
            else
              echo "  WARNING: Failed to download $src, skipping"
            fi
          done

          if [ "$downloaded" -eq 0 ]; then
            echo "No guides were downloaded; refusing to continue with a partial sync." >&2
            exit 1
          fi

      - name: Rebuild TOC files
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path

          def build_toc(md_path, output_path, max_level=3):
              p = Path(md_path)
              if not p.exists():
                  print(f"Skipping (not found): {md_path}")
                  return
              content = p.read_text()
              toc_lines = ["# Table of Contents\n"]
              for line in content.split('\n'):
                  m = re.match(r'^(#{1,%d}) (.+)' % max_level, line)
                  if m:
                      level = len(m.group(1))
                      title = m.group(2).strip()
                      anchor = re.sub(r'[^\w\s-]', '', title.lower())
                      anchor = re.sub(r'\s+', '-', anchor).strip('-')
                      indent = '  ' * (level - 1)
                      toc_lines.append(f'{indent}- [{title}](#{anchor})')
              Path(output_path).write_text('\n'.join(toc_lines))
              print(f'TOC rebuilt: {output_path} ({len(toc_lines)-1} entries)')

          TOC_TARGETS = [
              ('skills/google-style-javascript/references/full_guide.md',
               'skills/google-style-javascript/references/TOC.md'),
              ('skills/google-style-typescript/references/full_guide.md',
               'skills/google-style-typescript/references/TOC.md'),
              ('skills/google-style-cpp/references/full_guide.md',
               'skills/google-style-cpp/references/TOC.md'),
              ('skills/google-style-java/references/full_guide.md',
               'skills/google-style-java/references/TOC.md'),
          ]

          for src, toc in TOC_TARGETS:
              build_toc(src, toc)

          # Go: rebuild combined TOC
          combined = []
          for fname in ['guide.md', 'best_practices.md', 'decisions.md']:
              p = Path(f'skills/google-style-go/references/{fname}')
              if p.exists():
                  combined.append(f'\n## From {fname}\n')
                  combined.append(p.read_text())

          if combined:
              combined_text = '\n'.join(combined)
              toc_lines = ["# Go Style Guide — Combined TOC\n"]
              for line in combined_text.split('\n'):
                  m = re.match(r'^(#{1,3}) (.+)', line)
                  if m:
                      level = len(m.group(1))
                      title = m.group(2).strip()
                      anchor = re.sub(r'[^\w\s-]', '', title.lower())
                      anchor = re.sub(r'\s+', '-', anchor).strip('-')
                      indent = '  ' * (level - 1)
                      toc_lines.append(f'{indent}- [{title}](#{anchor})')
              Path('skills/google-style-go/references/TOC.md').write_text('\n'.join(toc_lines))
              print(f'TOC rebuilt: skills/google-style-go/references/TOC.md ({len(toc_lines)-1} entries)')
          PYEOF

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --stat

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-styleguides-${{ github.run_number }}
          commit-message: |
            chore: sync Google Style Guides from upstream

            Auto-generated by the weekly sync workflow.
            Source: https://github.com/google/styleguide
          title: 'chore: sync Google Style Guides from upstream'
          body: |
            ## Upstream Style Guide Sync

            This PR was automatically generated by the weekly sync workflow.

            **Source**: [google/styleguide](https://github.com/google/styleguide)

            ### Changed Files
            ```
            ${{ steps.diff.outputs.changed }}
            ```

            ### Review Checklist
            - [ ] TOC files look correct for changed guides
            - [ ] No structural regressions in converted Markdown (spot-check headings)
            - [ ] Verify key rules in quick_reference.md still match (may need manual updates)
            
            > Note: `quick_reference.md` files are **manually curated** and are not auto-updated.
            > If the upstream guide changed any fundamental rules, update the quick-reference manually.
          labels: |
            maintenance
            automated
          draft: false
