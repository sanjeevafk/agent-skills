name: Skill checks

on:
  pull_request:
    paths:
      - "skills/**"
      - "collections/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tier1:
    name: SkillEvaluator Tier 1 (no-LLM, advisory)
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@ba7779ad617c6444c98b6241a75bce92067e9d56
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:e96e3aaad89bf78c4f3f8c621e88005d18bd7c485b29c0d7945864700e5944e6
      scan-mode: auto
      paths: |
        skills
        collections
      min-score: 70
      enforcement-mode: advisory
      llm: false
