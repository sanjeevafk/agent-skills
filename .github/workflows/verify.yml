name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml numpy scipy beautifulsoup4 pytest

      - name: Skill validation
        run: python3 scripts/validate_skills.py

      - name: Rebuild index (consistency check)
        run: |
          if [ -f skills.json ]; then
            cp skills.json /tmp/skills.before.json
          fi
          python3 scripts/build_index.py
          python3 -c "import json; d=json.load(open('skills.json')); assert d['skills'], 'empty index'"

      - name: Skill tests
        run: python3 scripts/test_skills.py

      - name: Integration tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f" || exit 1; done

      - name: Python compilation
        run: python3 -m compileall -q scripts hooks
