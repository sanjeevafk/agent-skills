name: Upstream Sync

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      collection:
        description: 'Specific collection to sync (leave blank to sync all upstreams)'
        required: false
        default: ''
        type: string

concurrency:
  group: sync-upstreams
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Upstream Skill Collections
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync git

      - name: Run agent-skills sync
        run: |
          if [ -n "${{ inputs.collection }}" ]; then
            echo "Syncing single collection: ${{ inputs.collection }}"
            python3 bin/agent-skills sync "${{ inputs.collection }}"
          else
            echo "Syncing all registered upstreams from upstreams.json"
            python3 bin/agent-skills sync
          fi

      - name: Verify skill frontmatter integrity
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate frontmatter
        run: |
          uv sync --extra test
          uv run python scripts/check_frontmatter.py

      - name: Check for repository changes
        id: git-diff
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.git-diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sync): update upstream skill collections"
          title: "chore(sync): automated upstream skill collections update"
          body: |
            ## Automated Upstream Sync
            
            This automated PR synchronizes the latest upstream skill collections tracking [`upstreams.json`](upstreams.json).
            
            ### Verification
            - Executed `agent-skills sync` with sparse checkout and symlink resolution.
            - Validated all `SKILL.md` frontmatter blocks against schema.
            - Rebuilt warehouse index.
            
            *Triggered automatically by GitHub Actions.*
          branch: automation/upstream-sync
          delete-branch: true
          labels: |
            dependencies
            automated-pr
