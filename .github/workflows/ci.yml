name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (repository build / validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install project + test extras
        run: uv sync --extra test
      - name: Pytest
        run: uv run pytest tests/ -q -rs

  skill-frontmatter:
    name: Skill frontmatter integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Every SKILL.md frontmatter block must be valid YAML
        run: uv run python scripts/check_frontmatter.py

  no-secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject committed credentials
        run: |
          # Catches the .env-style files that .gitignore is meant to keep out.
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked"; exit 1
          fi
          if git ls-files | grep -qiE '(^|/)\.env$|orca_env|\.pem$|id_rsa'; then
            echo "::error::credential-shaped file tracked"; exit 1
          fi
          echo "OK: no credential-shaped files tracked"

  skill-lint:
    name: Skill quality lint (agent-skill-evals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Fetch agent-skill-evals
        run: git clone --depth 1 https://github.com/sanjeevafk/agent-skill-evals.git /tmp/agent-skill-evals
      - name: Lint added or modified SKILL.md files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE_REF"...HEAD -- '**/SKILL.md' 'SKILL.md' || true)
          if [ -z "$CHANGED" ]; then
            echo "OK: no SKILL.md files added or modified"
            exit 0
          fi
          FAILED=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            echo "Linting $file..."
            if ! python3 /tmp/agent-skill-evals/src/lint_skill.py "$file"; then
              FAILED=1
            fi
          done <<< "$CHANGED"
          exit "$FAILED"