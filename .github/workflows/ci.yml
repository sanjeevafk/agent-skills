name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (repository build / validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project + test extras
        run: uv sync --extra test
      - name: Pytest
        run: uv run pytest tests/ -q

  skill-frontmatter:
    name: Skill frontmatter integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Every SKILL.md frontmatter block must be valid YAML
        run: uv run python scripts/check_frontmatter.py

  no-secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed credentials
        run: |
          # Catches the .env-style files that .gitignore is meant to keep out.
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked"; exit 1
          fi
          if git ls-files | grep -qiE '(^|/)\.env$|orca_env|\.pem$|id_rsa'; then
            echo "::error::credential-shaped file tracked"; exit 1
          fi
          echo "OK: no credential-shaped files tracked"

  compiler-determinism:
    name: Compiler determinism (reproducibility of checklist artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project + test extras
        run: uv sync --extra test
      - name: Compile one skill twice; byte-identical output required
        run: |
          uv run python scripts/skills_compiler.py compile \
            --input skills/tdd/SKILL.md --output /tmp/run1/tdd.txt
          uv run python scripts/skills_compiler.py compile \
            --input skills/tdd/SKILL.md --output /tmp/run2/tdd.txt
          if ! cmp -s /tmp/run1/tdd.txt /tmp/run2/tdd.txt; then
            echo "::error::compiler output is non-deterministic"; exit 1
          fi
          echo "OK: deterministic ($(wc -c < /tmp/run1/tdd.txt) bytes)"
      - name: Every ablation mode is deterministic
        run: |
          for MODE in "" --no-examples --no-types --no-tables; do
            uv run python scripts/skills_compiler.py compile \
              --input skills/tdd/SKILL.md $MODE --output /tmp/runA.txt
            uv run python scripts/skills_compiler.py compile \
              --input skills/tdd/SKILL.md $MODE --output /tmp/runB.txt
            cmp -s /tmp/runA.txt /tmp/runB.txt || {
              echo "::error::non-deterministic under MODE='$MODE'"; exit 1; }
          done
          echo "OK: all ablation modes deterministic"

  artifact-reproducibility:
    name: Compiled artifacts reproduce from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Recompiles the benchmark corpus and compares SHA-256 digests against
      # benchmarks/checklists_v2/manifest.json, so "which tool produced the
      # published numbers" is answered by CI rather than by prose.
      # Fails on any drift not declared in KNOWN_EXCEPTIONS.
      - name: Verify checklist artifacts against manifest
        run: uv run python scripts/verify_compiled_artifacts.py

  router-integrity:
    name: Router cache integrity (no model downloads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --extra test
      # Guards the two defects that invalidated the original §8.7 numbers:
      # a stale cache (440 manifest vs 413 indexed skills) and name-leaking
      # document vectors. Both are checkable without torch or any model
      # download, so they belong in the default gate.
      - name: Vector cache agrees with routable catalogue
        run: |
          if [ ! -f skills_embeddings.npy ]; then
            echo "::notice::skills_embeddings.npy not present (generated, git-ignored); skipping cache-integrity checks"
            exit 0
          fi
          uv run python -c "
          import json, pathlib
          import numpy as np
          R = pathlib.Path('.')
          v = np.load(R / 'skills_embeddings.npy')
          m = json.loads((R / 'skills_manifest.json').read_text())['skills']
          c = json.loads((R / 'skills_canonical.json').read_text())
          routable = c['skills']
          assert v.shape[0] == len(m) == len(routable), (
              f'stale cache: {v.shape[0]} vectors != {len(m)} manifest != {len(routable)} routable')
          leaky = [e['name'] for e in m if e.get('rendered_text','').startswith(e['name'] + ':')]
          assert not leaky, f'name-leaking vectors: {leaky[:5]}'
          # collapsed duplicates must never be routable
          collapsed = set(c.get('collapsed', {}))
          present = collapsed & {n for n in routable}
          assert not present, f'collapsed duplicates routable again: {sorted(present)[:5]}'
          print(f'OK: {v.shape[0]} routable, vectors/manifest/catalogue agree, {len(collapsed)} dupes collapsed, no name leakage')
          "
      - name: Routing baseline is real TF-IDF (not the withdrawn scorer)
        run: |
          uv run python -c "
          import inspect, sys
          sys.path.insert(0, 'scripts')
          import benchmark_router as br
          src = inspect.getsource(br)
          assert 'naive_keyword_search' not in src, 'rigged baseline reintroduced'
          assert 'def tfidf_rank' in src, 'real TF-IDF baseline missing'
          print('OK: baseline is genuine TF-IDF')
          "